<!DOCTYPE html>
<html>
<head>
    <title>Raspbot Control</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; }
        .key-hint { margin-top: 50px; font-size: 1.2em; color: #aaa; }
        .status { color: #0f0; margin-top: 20px; }
        #is-talking { width: 10px; height: 10px; background-color: #f00; border-radius: 50%; margin: 0 auto; visibility: hidden; }
    </style>
</head>
<body>
    <h1>🎮 Raspbot Teleop</h1>
    <div id="status" class="status">Sistema Pronto</div>
    
    <div class="key-hint">Usa <b>W A S D</b> per guidare<br>Rilascia il tasto per fermarti
    <p>Premi <b>V</b> per parlare<br>Rilascia <b>V</b> per fermarti</p>
    <p >Premi <b>&larr; &rarr; &uarr; &darr;</b> per muovere la telecamera</p>
    </div>
    <div>Audio Stream: <div id="is-talking"></div></div>
    
</div>

    <div style="margin-top: 20px;">
    <h2>Live Feed</h2>
    {% if ROBOT_IP %}
    <!-- Il video parte solo quando la pagina è visibile: la camera del robot resta spenta altrimenti (risparmio batteria) -->
    <img id="camera-feed" data-src="http://{{ ROBOT_IP }}:8081/stream"
         style="border: 2px solid #555; border-radius: 10px; width: 640px; min-height: 120px; background: #000;"
         alt="Camera Feed">
    <div id="video-status" style="color:#aaa; font-size:0.9em;"></div>
    {% endif %}
    </div>

    <div style="margin-top: 20px;">
    <h2>Percezione</h2>
    <label><input type="checkbox" id="perception-toggle"> Il robot guarda (accende la camera)</label>
    <div id="perception-text" style="color:#aaa; margin-top:8px;"></div>
    </div>

    <div style="margin-top: 20px;">
    <h2>Autonomia</h2>
    <select id="autonomy-mode">
        <option value="OFF">Spenta</option>
        <option value="DRYRUN">Prova (decide ma non si muove)</option>
        <option value="ON">Accesa (si muove da sola!)</option>
    </select>
    <input id="autonomy-goal" list="room-labels" placeholder="vai in... (stanza)" autocomplete="off">
    <button id="autonomy-go">Vai</button>
    <div id="autonomy-log" style="color:#aaa; margin-top:8px;"></div>
    </div>

    <div style="margin-top: 20px;">
    <h2>Foto delle stanze</h2>
    <input id="room-label" list="room-labels" placeholder="stanza (es. cucina)" autocomplete="off">
    <datalist id="room-labels"></datalist>
    <button id="room-shot">📸 Scatta</button>
    <div id="room-status" style="color:#aaa; font-size:0.9em; margin-top:8px;"></div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();

        // Video on-demand: keepalive finché la pagina è visibile, spento quando non lo è
        const feed = document.getElementById('camera-feed');
        const videoStatus = document.getElementById('video-status');
        let keepaliveTimer = null, retryTimer = null;
        function startVideo() {
            if (!feed || keepaliveTimer) return;
            socket.emit('video_keepalive');
            keepaliveTimer = setInterval(() => socket.emit('video_keepalive'), 10000);
            videoStatus.innerText = 'Avvio camera...';
            connectFeed();
        }
        function connectFeed() {
            clearTimeout(retryTimer);
            feed.onload = () => { videoStatus.innerText = ''; };
            // il robot impiega 1-2 secondi ad accendere la camera: si riprova finché non risponde
            feed.onerror = () => { retryTimer = setTimeout(connectFeed, 1500); };
            feed.src = feed.dataset.src + '?t=' + Date.now();
        }
        function stopVideo() {
            if (!feed || !keepaliveTimer) return;
            clearInterval(keepaliveTimer); keepaliveTimer = null;
            clearTimeout(retryTimer);
            feed.removeAttribute('src');
            socket.emit('video_off');
            videoStatus.innerText = 'Camera spenta (pagina in background)';
        }
        document.addEventListener('visibilitychange', () => document.hidden ? stopVideo() : startVideo());
        window.addEventListener('beforeunload', () => { if (feed) socket.emit('video_off'); });
        socket.on('connect', () => { if (!document.hidden) startVideo(); });

        // Percezione: il Pi pubblica ciò che vede (oggetti + stanza) su robot/perception
        const percToggle = document.getElementById('perception-toggle');
        const percText = document.getElementById('perception-text');
        percToggle.addEventListener('change', () => {
            socket.emit('perception_toggle', {on: percToggle.checked});
            if (!percToggle.checked) percText.innerText = '';
        });
        socket.on('perception', (p) => {
            if (!percToggle.checked) return;
            const room = p.room ? `📍 ${p.room} (${p.margin})` : '📍 stanza non sicura';
            percText.innerText = `${room} · 👁️ ${p.text}`;
        });

        // Autonomia: "ON" si rinnova ogni 10 s finché la pagina è visibile; senza rinnovo il Pi si spegne da solo
        const autoMode = document.getElementById('autonomy-mode');
        const autoLog = document.getElementById('autonomy-log');
        let autoBeat = null;
        function setAutonomy(mode) {
            autoMode.value = mode;
            socket.emit('autonomy_mode', {mode});
            clearInterval(autoBeat); autoBeat = null;
            if (mode === 'ON') autoBeat = setInterval(() => socket.emit('autonomy_mode', {mode: 'ON'}), 10000);
        }
        autoMode.addEventListener('change', () => setAutonomy(autoMode.value));
        document.addEventListener('visibilitychange', () => { if (document.hidden && autoMode.value !== 'OFF') setAutonomy('OFF'); });
        document.getElementById('autonomy-go').addEventListener('click', () => socket.emit('autonomy_goal', {room: document.getElementById('autonomy-goal').value}));
        socket.on('autonomy_log', (m) => {
            if (m.event === 'override' || m.event === 'spenta') { autoMode.value = 'OFF'; clearInterval(autoBeat); autoBeat = null; }
            autoLog.innerText = `[${m.mode || ''}] ${m.event}: ${m.why}` + (m.room ? ` · 📍 ${m.room}` : '');
        });

        // Raccolta foto delle stanze (salvate sul Mac in data/rooms/<stanza>/)
        const roomLabel = document.getElementById('room-label');
        const roomStatus = document.getElementById('room-status');
        function showRooms(counts) {
            document.getElementById('room-labels').innerHTML = Object.keys(counts).map(k => `<option value="${k}">`).join('');
            roomStatus.innerText = Object.entries(counts).map(([k, n]) => `${k}: ${n}`).join(' · ') || 'nessuna foto ancora';
        }
        fetch('/api/rooms').then(r => r.json()).then(showRooms).catch(() => {});
        document.getElementById('room-shot').addEventListener('click', async () => {
            const res = await fetch('/api/rooms/capture', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                           body: JSON.stringify({label: roomLabel.value})});
            const data = await res.json();
            if (res.ok) showRooms(data.counts); else roomStatus.innerText = '⚠️ ' + data.error;
        });
        let lastKey = null;
        let audioContext;
        let processor;
        let input;
        let globalStream;
        let mediaRecorder;

        const isTalkingDiv = document.getElementById("is-talking");


        async function startTalking() {
            isTalkingDiv.style.visibility = "visible";
            // 1. Crea il contesto audio forzando 44100
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ 
                sampleRate: 44100 
            });
            
            globalStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            input = audioContext.createMediaStreamSource(globalStream);
            
            // 2. IMPORTANTE: Il buffer size deve essere coerente
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = (e) => {
                const inputData = event.inputBuffer.getChannelData(0); // Mono
                socket.emit('client_audio', inputData.buffer);
            };

            input.connect(processor);
            processor.connect(audioContext.destination);
        }
        function stopTalking() {
            if (processor) {
                processor.disconnect();
                input.disconnect();
                globalStream.getTracks().forEach(track => track.stop());
                console.log("🎤 Registrazione fermata.");
                isTalkingDiv.style.visibility = "hidden";
                socket.emit('end_audio');
            }
        }

        // Tasti di guida (STOP al rilascio) e tasti camera (ripetuti finché premuti, senza STOP)
        const DRIVE = {w:'FORWARD', s:'BACKWARD', a:'LEFT', d:'RIGHT'};
        const CAMERA = {arrowleft:'CAM_LEFT', arrowright:'CAM_RIGHT', arrowup:'CAM_UP', arrowdown:'CAM_DOWN', c:'CAM_CENTER'};
        const CAM_REPEAT_MS = 120;
        const camTimers = {};

        let lastSent = 0;
        function sendCommand(cmd) { lastSent = Date.now(); socket.emit('drive_command', {command: cmd}); }

        document.addEventListener('keydown', (e) => {
            if (e.target.matches && e.target.matches('input, textarea')) return; // non guidare mentre si scrive
            const key = e.key.toLowerCase();
            if (key === 'v' && !e.repeat) startTalking();
            if (key in DRIVE && lastKey !== key) {
                lastKey = key;
                sendCommand(DRIVE[key]);
                document.getElementById('status').innerText = "In movimento: " + DRIVE[key];
            } else if (key in DRIVE && Date.now() - lastSent > 250) {
                sendCommand(DRIVE[key]); // il Pi ferma il robot dopo ~0,8 s senza comandi: si rinnova finché il tasto è premuto
            } else if (key in CAMERA) {
                e.preventDefault(); // le frecce non devono scorrere la pagina
                if (camTimers[key] === undefined) {
                    sendCommand(CAMERA[key]);
                    if (key !== 'c') camTimers[key] = setInterval(() => sendCommand(CAMERA[key]), CAM_REPEAT_MS);
                    else camTimers[key] = null;
                    document.getElementById('status').innerText = "Camera: " + CAMERA[key];
                }
            }
        });
        // se la pagina perde il focus o la connessione cade non arriva il keyup: si ferma tutto
        function emergencyStop() { lastKey = null; sendCommand('STOP'); Object.keys(camTimers).forEach(k => { clearInterval(camTimers[k]); delete camTimers[k]; }); }
        window.addEventListener('blur', emergencyStop);
        document.addEventListener('visibilitychange', () => { if (document.hidden) emergencyStop(); });
        socket.on('disconnect', () => { lastKey = null; });

        document.addEventListener('keyup', (e) => {
            if (e.target.matches && e.target.matches('input, textarea')) return; // non guidare mentre si scrive
            const key = e.key.toLowerCase();
            if (key in DRIVE) {
                lastKey = null;
                sendCommand('STOP');
                document.getElementById('status').innerText = "STOP";
            } else if (key in CAMERA) {
                clearInterval(camTimers[key]);
                delete camTimers[key];
            }
            if (key === 'v') stopTalking();
        });

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (event) => {
                const reader = new FileReader();
                reader.readAsDataURL(event.data); 
                reader.onloadend = () => {
                    socket.emit('client_audio', {data: reader.result.split(',')[1]});
                };
            };
        });

        let audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 44100});
        let nextStartTime = 0;

        socket.on('robot_audio_stream', (buffer) => {
            // 1. Convertiamo il buffer (Int16) in Float32Array per l'AudioContext
            const int16Array = new Int16Array(buffer);
            const float32Array = new Float32Array(int16Array.length);
            
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            // 2. Creiamo un piccolo buffer audio
            const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 44100);
            audioBuffer.getChannelData(0).set(float32Array);

            // 3. Lo suoniamo in coda agli altri
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioCtx.destination);

            // Sincronizzazione per evitare lag o sovrapposizioni
            const currentTime = audioCtx.currentTime;
            if (nextStartTime < currentTime) {
                nextStartTime = currentTime;
            }
            
            source.start(nextStartTime);
            nextStartTime += audioBuffer.duration;
        });

    </script>
</body>
</html>
